<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.7 0 64 64" fill="none" role="img" aria-label="OpenGate">
  <defs>
    <radialGradient id="og-core" cx="32" cy="44" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e9ddff"/>
      <stop offset="0.6" stop-color="#9b6bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="og-ring" x1="32" y1="6" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="og-door">
      <path d="M11 60V30a21 21 0 0 1 42 0v30z"/>
    </clipPath>
  </defs>

  <!-- light spilling out of the doorway -->
  <g clip-path="url(#og-door)">
    <rect width="66" height="64" fill="url(#og-core)"/>
    <!-- receding arches, converging on the vanishing point -->
    <path d="M17 60V33a15 15 0 0 1 30 0v27" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6"/>
    <path d="M22 60V36a10 10 0 0 1 20 0v24" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.4"/>
    <path d="M26.5 60V39a5.5 5.5 0 0 1 11 0v21" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.2"/>
  </g>

  <!-- door leaf, swung open toward the viewer on the right hinge -->
  <path d="M53 60V30c1.6-6 4.6-9.6 8.6-10.4V63.4z" fill="#f3eeff" stroke="#6d28d9" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M55.6 58.6V32.6" stroke="#6d28d9" stroke-opacity=".3" stroke-width="1"/>
  <!-- the gate frame -->
  <path d="M11 60V30a21 21 0 0 1 42 0v30" stroke="url(#og-ring)" stroke-width="4" stroke-linecap="round"/>
  <!-- threshold -->
  <path d="M5 60h54" stroke="url(#og-ring)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- spark at the far end of the portal -->
  <path d="M32 33.5l1.2 3.3 3.3 1.2-3.3 1.2-1.2 3.3-1.2-3.3-3.3-1.2 3.3-1.2z" fill="#6d28d9"/>
</svg>
