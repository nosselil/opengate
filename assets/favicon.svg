<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.7 0 64 64" fill="none" role="img" aria-label="OpenGate">
  <defs>
    <radialGradient id="og-core" cx="32" cy="44" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.28" stop-color="#ffb547"/>
      <stop offset="0.65" stop-color="#ff5a36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-ring" x1="32" y1="6" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <clipPath id="og-door">
      <path d="M11 60V30a21 21 0 0 1 42 0v30z"/>
    </clipPath>
  </defs>

  <!-- light spilling out of the doorway -->
  <g clip-path="url(#og-door)">
    <rect width="64" height="64" fill="url(#og-core)"/>
    <!-- receding arches, converging on the vanishing point -->
    <path d="M17 60V33a15 15 0 0 1 30 0v27" stroke="#ffd27a" stroke-opacity=".55" stroke-width="1.6"/>
    <path d="M22 60V36a10 10 0 0 1 20 0v24" stroke="#fff1c9" stroke-opacity=".7" stroke-width="1.4"/>
    <path d="M26.5 60V39a5.5 5.5 0 0 1 11 0v21" stroke="#fffaf0" stroke-opacity=".9" stroke-width="1.2"/>
  </g>

  <!-- door leaf, swung open toward the viewer on the right hinge -->
  <path d="M53 60V30c1.6-6 4.6-9.6 8.6-10.4V63.4z" fill="#141a2b" stroke="#ff8a3d" stroke-opacity=".9" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M55.6 58.6V32.6" stroke="#ffb547" stroke-opacity=".35" stroke-width="1"/>
  <!-- the gate frame -->
  <path d="M11 60V30a21 21 0 0 1 42 0v30" stroke="url(#og-ring)" stroke-width="4" stroke-linecap="round"/>
  <!-- threshold -->
  <path d="M5 60h54" stroke="url(#og-ring)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- spark at the far end of the portal -->
  <path d="M32 33.5l1.2 3.3 3.3 1.2-3.3 1.2-1.2 3.3-1.2-3.3-3.3-1.2 3.3-1.2z" fill="#fffaf0"/>
</svg>
